# ─────────────────────────────────────────────────────────────────────────────
#  Nginx config for sunnahforummah.shop (Next.js frontend)
#
#  This file is mounted into the sunnah_nginx container via
#  /root/sunnah/docker-compose.prod.yml:
#    volumes:
#      - /root/node-sunnah/sfu-backend/sunnah-for-ummah-frontend/nginx/nginx.conf
#          :/etc/nginx/conf.d/frontend.conf:ro
#
#  After editing: docker exec sunnah_nginx nginx -s reload
# ─────────────────────────────────────────────────────────────────────────────



# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sunnahforummah.shop www.sunnahforummah.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — storefront ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sunnahforummah.shop www.sunnahforummah.shop;

    ssl_certificate     /etc/letsencrypt/live/sunnahforummah.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunnahforummah.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip for faster page loads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        set $upstream http://frontend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
