# ─────────────────────────────────────────────────────────────────────────────
#  Nginx config for sunnahforummah.shop (Next.js frontend)
#
#  This file is mounted into the sunnah_nginx container via
#  /root/sunnah/docker-compose.prod.yml as frontend.conf
#
#  After editing: docker exec sunnah_nginx nginx -s reload
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sunnahforummah.shop www.sunnahforummah.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — Next.js storefront ───────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sunnahforummah.shop www.sunnahforummah.shop;

    ssl_certificate     /etc/letsencrypt/live/sunnahforummah.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunnahforummah.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # SSL session caching — reuse handshakes across requests (big win for mobile)
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;


    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Proxy buffer tuning — reduces round-trips to Next.js ─────────────────
    proxy_buffers         16 16k;
    proxy_buffer_size     32k;
    proxy_busy_buffers_size 64k;

    # ── Next.js static assets — cache forever (content-hashed filenames) ──────
    location /_next/static/ {
        set $upstream http://frontend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Immutable cache: browser never re-requests these files
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Static public files (favicon, images, etc.) ───────────────────────────
    location /static/ {
        set $upstream http://frontend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ── All other requests → Next.js ─────────────────────────────────────────
    location / {
        set $upstream http://frontend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR not needed in prod, but keep for safety)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Keep-alive connections to Next.js (avoids TCP handshake per request)
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
